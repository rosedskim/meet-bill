<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모임 정산</title>
<style>
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --readonly: #eceff3;
  --text: #191f28;
  --muted: #6b7684;
  --border: #e5e8eb;
  --input-border: #b0b8c1;
  --accent: #3182f6;
  --accent-fg: #1b64da;
  --accent-text: #ffffff;
  --accent-soft: #e8f3ff;
  --danger: #d93636;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.05);
  --paper: #fbf8f1;
  --paper-text: #2b2620;
  --paper-muted: #8a8070;
  --paper-rule: #c9bfa9;
  --stamp: #d64545;
  --paper-shadow: 0 1px 2px rgba(60, 40, 10, 0.14), 0 8px 24px rgba(60, 40, 10, 0.14);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101214;
    --surface: #1b1e23;
    --surface-2: #252a31;
    --readonly: #2d333b;
    --text: #f2f4f6;
    --muted: #9ba3ae;
    --border: #2f353d;
    --input-border: #5b6470;
    --accent: #3182f6;
    --accent-fg: #6aaaff;
    --accent-text: #ffffff;
    --accent-soft: #1b2e4d;
    --danger: #ff8a80;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.3);
    --paper: #2a2620;
    --paper-text: #efe6d4;
    --paper-muted: #a79c86;
    --paper-rule: #5a5142;
    --stamp: #ff7a70;
    --paper-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(0, 0, 0, 0.45);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 56px; }
h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 20px; }
h2 { font-size: 1.0625rem; font-weight: 700; margin: 0 0 14px; }
section {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 20px;
}
form { display: flex; gap: 8px; }
input:not([type="checkbox"]) {
  flex: 1;
  min-width: 0;
  min-height: 48px;
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1px solid var(--input-border);
  border-radius: 12px;
  padding: 0 14px;
}
input::placeholder { color: var(--muted); opacity: 0.8; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 0; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
button:focus-visible { box-shadow: 0 0 0 3px var(--accent); outline: none; }
/* 자동 금액은 고정 칸이 꺼져 있는 동안 읽기 전용 값으로 보인다. 입력칸처럼 보이는 테두리를 없앤다. */
input:disabled { background: var(--readonly); border-color: transparent; cursor: default; }
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 12px;
}
button:active { transform: scale(0.97); }
form button {
  min-height: 48px;
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  padding: 0 20px;
}
.notice { min-height: 1.5em; margin: 8px 0 0; color: var(--danger); font-size: 0.875rem; }
.tags, .picks { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
.tags li {
  display: flex;
  align-items: center;
  gap: 2px;
  max-width: 100%;
  min-height: 44px;
  padding: 0 4px 0 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.tags button {
  flex: none;
  width: 36px;
  height: 44px;
  background: transparent;
  color: var(--muted);
  font-size: 1.125rem;
  line-height: 1;
}
.empty { color: var(--muted); font-size: 0.875rem; }
section + section { margin-top: 16px; }
#title { width: 100%; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 14px; }
.section-head h2 { margin: 0; }
.solid { min-height: 48px; background: var(--accent); color: var(--accent-text); font-weight: 600; padding: 0 20px; }
.outline {
  min-width: 44px;
  min-height: 44px;
  padding: 0 14px;
  background: var(--surface);
  color: inherit;
  border: 1px solid var(--border);
}
.card .outline { background: var(--surface); }
.outline[aria-disabled="true"] { opacity: 0.4; cursor: default; }
.rounds { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface-2); border-radius: 14px; padding: 14px; }
.card-head { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.card-head h3 { flex: 1; margin: 0; font-size: 1.0625rem; font-weight: 700; }
.fields { display: flex; flex-wrap: wrap; gap: 8px; }
.fields input { flex: 2 1 140px; }
.fields .total { flex: 1 1 120px; }
.pick-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.pick-head .outline { padding: 0 12px; font-size: 0.875rem; }
.pick-head span { flex: 1; white-space: nowrap; color: var(--muted); font-size: 0.875rem; }
.pick {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: inherit;
  text-align: left;
  overflow-wrap: anywhere;
}
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.pick[aria-pressed="true"]::before { content: "\2713\00a0"; }
.attendee { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin: 10px 0 0; }
.who { flex: 0 1 4.5em; min-width: 3em; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amount { position: relative; flex: 1 1 8em; min-width: 8em; }
.amount input { width: 100%; padding: 0 48px 0 10px; text-align: right; font-variant-numeric: tabular-nums; }
/* Safari는 disabled 입력의 글자를 따로 흐리게 칠해서 -webkit-text-fill-color로 막는다. 자동 금액은 읽혀야 하는 값이다. */
.amount input:disabled { color: var(--text); -webkit-text-fill-color: var(--text); opacity: 1; }
.plus-one {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-fg);
  font-size: 0.75rem;
  font-weight: 700;
  pointer-events: none;
}
.plus-one:empty { display: none; }
.checks { display: flex; margin-left: auto; }
.check { display: flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-size: 0.9375rem; cursor: pointer; }
.check input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--accent); }
.settle { margin-top: 32px; padding: 0; background: none; box-shadow: none; }
.settle p { margin: 0 0 10px; color: var(--muted); font-size: 0.875rem; text-align: center; }
.settle button { width: 100%; min-height: 56px; font-size: 1.125rem; font-weight: 700; box-shadow: 0 6px 16px rgba(49, 130, 246, 0.3); }
.result { margin-top: 32px; padding: 0; background: none; box-shadow: none; border-radius: 0; }
.paper {
  padding: 28px 20px 20px;
  background: var(--paper);
  color: var(--paper-text);
  border-radius: 6px;
  box-shadow: var(--paper-shadow);
}
.paper-label { margin: 0 0 4px; color: var(--paper-muted); font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.5em; text-align: center; text-indent: 0.5em; }
.paper h2 {
  margin: 0 0 16px;
  padding: 0 4px 18px;
  border-bottom: 1px dashed var(--paper-rule);
  font-size: 1.625rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  text-align: center;
  overflow-wrap: anywhere;
}
.csv-row { margin: 12px 0 0; }
.csv-row:empty { display: none; }
.csv-row .outline { width: 100%; }
/* 열 10개짜리 표가 폰 폭에서 글자 하한에 걸리지 않도록 정산서만 화면 끝까지 넓힌다. */
@media (max-width: 480px) {
  section { padding: 16px; }
  .card { padding: 12px; }
  .paper { margin-inline: -16px; padding: 24px 4px 12px; border-radius: 0; }
  .csv-row { padding-inline: 0; }
}
.errors { margin: 0; padding-left: 20px; color: var(--danger); }
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
th, td { padding: var(--py, 0.4em) var(--px, 0.3em); text-align: right; white-space: nowrap; }
tbody th, tbody td { border-bottom: 1px dashed var(--paper-rule); }
thead th { vertical-align: bottom; border-bottom: 1px solid var(--paper-text); color: var(--paper-muted); font-weight: 600; }
th[scope="row"], thead th:first-child { text-align: left; }
th[scope="row"] { font-weight: 600; }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
tfoot th, tfoot td { padding-top: calc(var(--py, 0.4em) + 0.1em); border-top: 3px double var(--paper-text); font-weight: 800; }
td.total { font-weight: 700; }
td.sent { color: var(--paper-muted); }
td.done { text-align: right; }
.stamp {
  display: inline-block;
  padding: 0 0.3em;
  border: 0.12em solid var(--stamp);
  border-radius: 0.25em;
  color: var(--stamp);
  font-weight: 800;
  line-height: 1.2;
  transform: rotate(-6deg);
}
th span { display: block; }
.round-name { max-width: 5.5em; margin-left: auto; font-weight: 400; color: var(--paper-muted); white-space: normal; overflow-wrap: anywhere; }
.extra { display: block; font-size: 0.7em; font-weight: 700; color: var(--accent-fg); line-height: 1.1; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>모임 정산</h1>
    <button id="reset" type="button" class="outline">새로 시작</button>
  </div>
  <section>
    <h2>모임 정보</h2>
    <input id="title" type="text" placeholder="모임정산표" aria-label="모임명" autocomplete="off">
  </section>
  <section>
    <h2>인원</h2>
    <form id="member-form" autocomplete="off">
      <input id="member-name" type="text" placeholder="이름" aria-label="이름">
      <button type="submit">등록</button>
    </form>
    <p id="member-notice" class="notice" role="status"></p>
    <ul id="members" class="tags"></ul>
  </section>
  <section>
    <div class="section-head">
      <h2>차수</h2>
      <button id="add-round" type="button" class="solid">차수 추가</button>
    </div>
    <div id="rounds" class="rounds"></div>
  </section>
  <section class="settle">
    <p>차수를 모두 입력했으면 눌러 보세요</p>
    <button id="settle" type="button" class="solid">결산</button>
  </section>
  <section id="result" class="result" hidden>
    <div class="paper">
      <p class="paper-label">정산서</p>
      <h2 id="result-title"></h2>
      <div id="result-body"></div>
    </div>
    <div id="csv-row" class="csv-row"></div>
  </section>
</main>
<script>
const state = { members: [], rounds: [], title: '' };
let memberNotice = '';
let nextRoundId = 1;
let settleShown = false;

const form = document.getElementById('member-form');
const nameInput = document.getElementById('member-name');
const noticeEl = document.getElementById('member-notice');
const membersEl = document.getElementById('members');
const roundsEl = document.getElementById('rounds');
const addRoundBtn = document.getElementById('add-round');
const settleBtn = document.getElementById('settle');
const resultEl = document.getElementById('result');
const resultBodyEl = document.getElementById('result-body');
const csvRowEl = document.getElementById('csv-row');
const resultTitleEl = document.getElementById('result-title');
const resetBtn = document.getElementById('reset');
const titleInput = document.getElementById('title');

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

const STORAGE_KEY = 'meet-bill:v1';
const isObject = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
const isAmount = (n) => Number.isInteger(n) && n >= 0 && n <= 999999999999;

// 이름이 키라서 JSON.parse가 만든 일반 객체를 그대로 쓰면 constructor 같은 이름에서 in 검사가 틀린다. 프로토타입 없는 객체에 다시 담는다.
function restoreMap(source, names, isValid) {
  const out = Object.create(null);
  if (isObject(source)) {
    for (const name of names) if (Object.hasOwn(source, name) && isValid(source[name])) out[name] = source[name];
  }
  return out;
}

function restoreRounds(list, members) {
  const seen = new Set();
  const rounds = list.filter(isObject).map((r) => {
    const picked = new Set(Array.isArray(r.participants) ? r.participants : []);
    const participants = members.filter((m) => picked.has(m));
    // id + 1이 정확한 정수로 남도록 상한을 둔다.
    const id = Number.isInteger(r.id) && r.id > 0 && r.id < 1e9 && !seen.has(r.id) ? r.id : null;
    if (id !== null) seen.add(id);
    return {
      id,
      name: typeof r.name === 'string' ? r.name : '',
      total: isAmount(r.total) ? r.total : null,
      participants,
      fixed: restoreMap(r.fixed, participants, isAmount),
      sent: restoreMap(r.sent, participants, (v) => v === true),
    };
  });
  let next = Math.max(0, ...seen) + 1;
  for (const r of rounds) if (r.id === null) r.id = next++;
  return rounds;
}

// 저장된 값은 믿지 않는다. 모양이 틀리면 null을 돌려줘 빈 상태로 시작한다.
function parseSaved(text) {
  const data = JSON.parse(text);
  if (!isObject(data) || !Array.isArray(data.members)) return null;
  const members = [...new Set(data.members.filter((m) => typeof m === 'string').map((m) => m.trim()).filter(Boolean))];
  return {
    members,
    rounds: restoreRounds(Array.isArray(data.rounds) ? data.rounds : [], members),
    title: typeof data.title === 'string' ? data.title : '',
  };
}

function load() {
  try {
    return parseSaved(localStorage.getItem(STORAGE_KEY));
  } catch {
    return null;
  }
}

function save() {
  const { members, rounds, title } = state;
  try {
    if (!members.length && !rounds.length && !title) localStorage.removeItem(STORAGE_KEY);
    else localStorage.setItem(STORAGE_KEY, JSON.stringify({ members, rounds, title }));
  } catch {
    // 저장소가 막혔거나 가득 차도 앱은 저장 없이 계속 쓸 수 있어야 한다.
  }
}

// 인원 입력칸은 HTML에 고정해 두고 render가 건드리지 않는다. 다시 그리면 타이핑 중 포커스가 사라진다.
function renderMembers() {
  noticeEl.textContent = memberNotice;

  const tags = state.members.map((name, i) => {
    const li = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = name;
    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = '×';
    del.setAttribute('aria-label', name + ' 삭제');
    del.dataset.index = i;
    li.append(label, del);
    return li;
  });
  membersEl.replaceChildren(...tags);
}

function button(cls, text, label, key, action) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.textContent = text;
  b.setAttribute('aria-label', label);
  b.dataset.key = key;
  b.dataset.action = action;
  return b;
}

const ordinal = (i) => i + 1 + '차';

function roundCard(round, i) {
  const n = ordinal(i);
  const k = (what) => round.id + ':' + what;

  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.roundId = round.id;

  const head = document.createElement('div');
  head.className = 'card-head';
  const title = document.createElement('h3');
  title.textContent = n;
  const up = button('outline', '▲', n + ' 위로 이동', k('up'), 'up');
  const down = button('outline', '▼', n + ' 아래로 이동', k('down'), 'down');
  up.setAttribute('aria-disabled', i === 0);
  down.setAttribute('aria-disabled', i === state.rounds.length - 1);
  head.append(title, up, down, button('outline', '삭제', n + ' 삭제', k('remove'), 'remove'));

  const fields = document.createElement('div');
  fields.className = 'fields';
  const name = document.createElement('input');
  name.type = 'text';
  name.className = 'name';
  name.placeholder = '이름 (예: 미미철판)';
  name.setAttribute('aria-label', n + ' 이름');
  name.autocomplete = 'off';
  name.dataset.key = k('name');
  name.value = round.name;
  const total = document.createElement('input');
  total.type = 'text';
  total.className = 'total';
  total.inputMode = 'numeric';
  total.placeholder = '총금액(원)';
  total.setAttribute('aria-label', n + ' 총금액');
  total.autocomplete = 'off';
  total.dataset.key = k('total');
  total.value = round.total ?? '';
  fields.append(name, total);

  const pickHead = document.createElement('div');
  pickHead.className = 'pick-head';
  const label = document.createElement('span');
  label.textContent = '참석자 ' + round.participants.length + '/' + state.members.length;
  pickHead.append(
    label,
    button('outline', '전체선택', n + ' 전체선택', k('all'), 'all'),
    button('outline', '전체해제', n + ' 전체해제', k('none'), 'none'),
  );

  const picks = document.createElement('div');
  picks.className = 'picks';
  if (!state.members.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = '인원을 먼저 등록하세요';
    picks.append(empty);
  }
  for (const m of state.members) {
    const pick = button('pick', m, m, k('tag:' + m), 'toggle');
    pick.dataset.member = m;
    pick.setAttribute('aria-pressed', round.participants.includes(m));
    picks.append(pick);
  }

  const rows = round.participants.map((m) => {
    const row = document.createElement('div');
    row.className = 'attendee';
    row.dataset.member = m;
    const who = document.createElement('span');
    who.className = 'who';
    who.title = m;
    who.textContent = m;
    const amount = document.createElement('span');
    amount.className = 'amount';
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.setAttribute('aria-label', n + ' ' + m + ' 금액');
    input.autocomplete = 'off';
    input.dataset.key = k('amount:' + m);
    input.dataset.member = m;
    const plusOne = document.createElement('span');
    plusOne.className = 'plus-one';
    amount.append(input, plusOne);
    const check = (field, text) => {
      const label = document.createElement('label');
      label.className = 'check';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.setAttribute('aria-label', n + ' ' + m + ' ' + text);
      box.dataset.key = k(field + ':' + m);
      box.dataset.member = m;
      box.dataset.field = field;
      box.checked = m in round[field];
      label.append(box, text);
      return label;
    };
    const checks = document.createElement('div');
    checks.className = 'checks';
    checks.append(check('fixed', '고정'), check('sent', '보냄'));
    row.append(who, amount, checks);
    return row;
  });

  const error = document.createElement('p');
  error.className = 'notice card-error';
  error.setAttribute('role', 'status');
  error.hidden = true;

  card.append(head, fields, pickHead, picks, ...rows, error);
  return card;
}

// 입력칸은 input 이벤트가 상태만 고치고 다시 그리지 않는다. 구조가 바뀔 때만 영역을 새로 만들고, 포커스와 선택 범위를 data-key로 되찾는다.
function redraw(container, children, fallback) {
  const active = document.activeElement;
  const hadFocus = container.contains(active);
  const key = hadFocus ? active.dataset.key : null;
  const range = hadFocus && active.selectionStart !== undefined ? [active.selectionStart, active.selectionEnd] : null;

  container.replaceChildren(...children);

  if (!hadFocus) return;
  const next = [...container.querySelectorAll('[data-key]')].find((el) => el.dataset.key === key) ?? fallback;
  next.focus();
  if (range && next.setSelectionRange) next.setSelectionRange(...range);
}

function renderRounds() {
  redraw(roundsEl, state.rounds.map(roundCard), addRoundBtn);
}

// 금액 칸 값과 +1, 오류 문구는 카드를 다시 그리지 않고 제자리에서 고친다. 고정 칸은 사용자가 치는 중일 수 있어 상태와 다를 때만 쓴다.
function refreshShares() {
  state.rounds.forEach((round, i) => {
    const card = roundsEl.children[i];
    const { error, byName } = roundShares(state, i);
    for (const row of card.querySelectorAll('.attendee')) {
      const m = row.dataset.member;
      const input = row.querySelector('input[type="text"]');
      const share = byName?.get(m);
      input.disabled = !(m in round.fixed);
      if (input.disabled) input.value = share ? won(share.amount) : '-';
      else if (Number(input.value) !== round.fixed[m]) input.value = round.fixed[m];
      row.querySelector('.plus-one').textContent = share?.extra ? '+1' : '';
    }
    const notice = card.querySelector('.card-error');
    notice.textContent = error ?? '';
    notice.hidden = !error;
  });
}

const won = (n) => n.toLocaleString('ko-KR');
const remainingText = (n) => (n === 0 ? '완료' : won(n));

function resultHead(round, i) {
  const th = document.createElement('th');
  th.scope = 'col';
  const n = document.createElement('span');
  n.textContent = ordinal(i);
  th.append(n);
  const name = round.name.trim();
  if (name) {
    const nm = document.createElement('span');
    nm.className = 'round-name';
    nm.textContent = name;
    th.append(nm);
  }
  return th;
}

function resultCell(cell) {
  const td = document.createElement('td');
  if (!cell) {
    td.textContent = '-';
    return td;
  }
  td.textContent = (cell.sent ? '\u2713\u00a0' : '') + won(cell.amount);
  if (cell.sent) td.className = 'sent';
  if (cell.extra) {
    const mark = document.createElement('span');
    mark.className = 'extra';
    mark.textContent = '+1';
    td.append(mark);
  }
  return td;
}

// 표는 nowrap이라 숫자가 쪼개지지 않는 대신 자연 폭이 컨테이너보다 클 수 있다. 열이 적을수록 큰 글자와 넉넉한 칸 여백에서 시작하고, 넘칠 때만 글자 크기를 줄여 맞춘다. 하한에 걸리면 표 컨테이너만 가로 스크롤한다.
// 글자 폭이 소수점 단위로 반올림되어 한 번에 맞지 않으므로, 맞을 때까지 몇 번 더 보정한다.
const TABLE_FONT_MIN = 7;
const TABLE_SIZES = [
  { maxCols: 3, font: 20, py: 0.9, px: 0.6 },
  { maxCols: 5, font: 18, py: 0.7, px: 0.5 },
  { maxCols: 7, font: 16, py: 0.55, px: 0.4 },
  { maxCols: Infinity, font: 14, py: 0.4, px: 0.2 },
];

function fitTable() {
  const wrap = resultBodyEl.querySelector('.table-wrap');
  if (!wrap || !wrap.clientWidth) return;
  const table = wrap.firstChild;
  const cols = table.rows[0].cells.length;
  const base = TABLE_SIZES.find((s) => cols <= s.maxCols);
  wrap.style.setProperty('--py', base.py + 'em');
  wrap.style.setProperty('--px', base.px + 'em');
  let size = base.font;
  for (let i = 0; i < 5; i++) {
    wrap.style.fontSize = size + 'px';
    const width = table.getBoundingClientRect().width;
    if (width <= wrap.clientWidth || size === TABLE_FONT_MIN) return;
    size = Math.max(TABLE_FONT_MIN, (size * (wrap.clientWidth - 0.5)) / width);
  }
}

function resultTable(result) {
  const table = document.createElement('table');

  const headRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.textContent = '이름';
  const sum = document.createElement('th');
  sum.scope = 'col';
  sum.textContent = '합계';
  headRow.append(corner, ...state.rounds.map(resultHead), sum);
  if (result.showPaid) {
    const paid = document.createElement('th');
    paid.scope = 'col';
    paid.textContent = '보낸 금액';
    const remaining = document.createElement('th');
    remaining.scope = 'col';
    remaining.textContent = '남은 금액';
    headRow.append(paid, remaining);
  }
  const thead = document.createElement('thead');
  thead.append(headRow);

  const tbody = document.createElement('tbody');
  for (const row of result.rows) {
    const tr = document.createElement('tr');
    const who = document.createElement('th');
    who.scope = 'row';
    who.textContent = row.name;
    const total = document.createElement('td');
    total.className = 'total';
    total.textContent = won(row.total);
    tr.append(who, ...row.cells.map(resultCell), total);
    if (result.showPaid) {
      const paid = document.createElement('td');
      paid.textContent = row.paid ? won(row.paid) : '-';
      const remaining = document.createElement('td');
      if (row.remaining === 0) {
        remaining.className = 'done';
        const stamp = document.createElement('span');
        stamp.className = 'stamp';
        stamp.textContent = remainingText(0);
        remaining.append(stamp);
      } else {
        remaining.textContent = remainingText(row.remaining);
      }
      tr.append(paid, remaining);
    }
    tbody.append(tr);
  }

  const footRow = document.createElement('tr');
  const label = document.createElement('th');
  label.scope = 'row';
  label.textContent = '합계';
  const cells = [...result.roundTotals, result.grandTotal].map((n) => {
    const td = document.createElement('td');
    td.textContent = won(n);
    return td;
  });
  footRow.append(label, ...cells);
  // 보낸 금액의 합은 전체 합계 옆에서 정산 합계로 읽혀 두 열 모두 비운다.
  if (result.showPaid) footRow.append(document.createElement('td'), document.createElement('td'));
  const tfoot = document.createElement('tfoot');
  tfoot.append(footRow);

  table.append(thead, tbody, tfoot);
  return table;
}

function resultErrors(errors) {
  const intro = document.createElement('p');
  intro.textContent = '아래를 고치면 표가 나와요.';
  const list = document.createElement('ul');
  list.className = 'errors';
  list.append(...errors.map(({ message }) => {
    const li = document.createElement('li');
    li.textContent = message;
    return li;
  }));
  return [intro, list];
}

const resultTitle = () => state.title.trim() || '모임정산표';

const csvRemaining = (n) => (n === 0 ? '완료' : String(n));

// 스프레드시트가 수식으로 읽지 않도록 =, +, -, @로 시작하는 글자 앞에 '를 붙인다. 미참석 칸의 '-'는 수식이 아니라서 둔다.
function csvField(value) {
  let text = String(value);
  if (/^[=+\-@]/.test(text) && text !== '-') text = "'" + text;
  return '"' + text.replaceAll('"', '""') + '"';
}

function csvOf(result) {
  const head = ['이름', ...state.rounds.map(roundLabel), '합계'];
  if (result.showPaid) head.push('보낸 금액', '남은 금액');
  const body = result.rows.map((row) => {
    const line = [row.name, ...row.cells.map((c) => (c ? c.amount : '-')), row.total];
    if (result.showPaid) line.push(row.paid ? row.paid : '-', csvRemaining(row.remaining));
    return line;
  });
  const foot = ['합계', ...result.roundTotals, result.grandTotal];
  if (result.showPaid) foot.push('', '');
  return [head, ...body, foot].map((line) => line.map(csvField).join(',')).join('\r\n');
}

function downloadCsv(result) {
  const blob = new Blob(['\ufeff' + csvOf(result)], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `meet-bill-${today()}.csv`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function renderResult() {
  resultEl.hidden = !settleShown;
  if (!settleShown) return;
  resultTitleEl.textContent = resultTitle();

  if (!state.members.length || !state.rounds.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = state.members.length ? '차수를 추가하세요' : '인원을 먼저 등록하세요';
    resultBodyEl.replaceChildren(empty);
    csvRowEl.replaceChildren();
    return;
  }
  const result = calc(state);
  if (result.errors.length) {
    resultBodyEl.replaceChildren(...resultErrors(result.errors));
    csvRowEl.replaceChildren();
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  wrap.append(resultTable(result));
  const csv = document.createElement('button');
  csv.type = 'button';
  csv.className = 'outline';
  csv.textContent = 'CSV로 저장';
  csv.addEventListener('click', () => downloadCsv(result));
  resultBodyEl.replaceChildren(wrap);
  csvRowEl.replaceChildren(csv);
  fitTable();
}

// 모든 상태 변경은 render를 거친다. 이름·총금액·금액·고정·보냄 input은 입력칸을 다시 그리면 포커스를 잃으므로 inputs: false로 두고, 카드 금액과 결과만 갱신한다.
function render({ inputs = true } = {}) {
  renderMembers();
  if (inputs) renderRounds();
  refreshShares();
  renderResult();
  save();
}

function addMember(raw) {
  const name = raw.trim();
  if (!name) return false;
  if (state.members.includes(name)) {
    memberNotice = '이미 등록된 이름이에요';
    return false;
  }
  state.members.push(name);
  memberNotice = '';
  return true;
}

function roundLabel(round, i) {
  const name = round.name.trim();
  return name ? ordinal(i) + ' ' + name : ordinal(i);
}

// 남는 1원은 받을 사람 중 뒤에서부터 1원씩 더 낸다. 고정 금액자를 뺀 나머지에도 같은 규칙을 쓰려고 사람 목록과 금액만 받는다.
function distribute(people, amount) {
  const base = Math.floor(amount / people.length);
  const firstExtra = people.length - (amount - base * people.length);
  return people.map((_, i) => ({ amount: base + (i >= firstExtra ? 1 : 0), extra: i >= firstExtra }));
}

// 카드와 결과표가 같은 분배를 보도록 한 차수의 계산은 여기에만 둔다.
// missing은 입력이 덜 된 상태(결과표는 안내하고 카드는 조용히 -를 보인다), error는 고정 금액이 어긋난 상태(둘 다 안내한다).
function roundShares(state, roundIndex) {
  const round = state.rounds[roundIndex];
  const label = roundLabel(round, roundIndex);
  const attendees = state.members.filter((m) => round.participants.includes(m));
  const missing = [];
  if (round.total === null) missing.push(label + ': 총금액을 입력하세요');
  else if (round.total <= 0) missing.push(label + ': 총금액은 0보다 커야 해요');
  if (!attendees.length) missing.push(label + ': 참석자를 선택하세요');
  if (missing.length) return { missing, error: null, byName: null };

  const pinned = attendees.filter((m) => m in round.fixed);
  const free = attendees.filter((m) => !(m in round.fixed));
  const pinnedSum = pinned.reduce((sum, m) => sum + round.fixed[m], 0);
  const rest = round.total - pinnedSum;
  if (rest < 0) return { missing, error: label + ': 고정 금액의 합(' + won(pinnedSum) + '원)이 총금액보다 커요', byName: null };
  if (!free.length && rest > 0) return { missing, error: label + ': 모두 고정인데 합(' + won(pinnedSum) + '원)이 총금액과 달라요', byName: null };
  const split = distribute(free, rest);
  const byName = new Map([
    ...pinned.map((m) => [m, { amount: round.fixed[m], extra: false }]),
    ...free.map((m, i) => [m, split[i]]),
  ]);
  return { missing, error: null, byName };
}

function calc(state) {
  const errors = [];
  const shares = state.rounds.map((_, roundIndex) => {
    const { missing, error, byName } = roundShares(state, roundIndex);
    for (const message of error ? [...missing, error] : missing) errors.push({ roundIndex, message });
    return byName;
  });
  if (errors.length) return { errors, rows: null, roundTotals: null, grandTotal: null, showPaid: false };

  const rows = state.members.map((name) => {
    const cells = shares.map((byName, r) => {
      const share = byName.get(name);
      return share ? { ...share, sent: name in state.rounds[r].sent } : null;
    });
    const total = cells.reduce((sum, c) => sum + (c ? c.amount : 0), 0);
    const paid = cells.reduce((sum, c) => sum + (c && c.sent ? c.amount : 0), 0);
    return { name, cells, total, paid, remaining: total - paid };
  });
  const roundTotals = shares.map((_, r) => rows.reduce((sum, row) => sum + (row.cells[r] ? row.cells[r].amount : 0), 0));
  const showPaid = rows.some((row) => row.cells.some((c) => c && c.sent));
  return { errors, rows, roundTotals, grandTotal: roundTotals.reduce((a, b) => a + b, 0), showPaid };
}

// participants는 항상 members 순서로 다시 만든다. 순서를 보존하고 중복이 생길 수 없다.
// 참석자에서 빠진 사람의 고정 금액과 보냄도 여기서 지워, 다시 참석해도 예전 값이 되살아나지 않는다.
function setParticipants(round, picked) {
  round.participants = state.members.filter((m) => picked.has(m));
  for (const map of [round.fixed, round.sent]) {
    for (const name of Object.keys(map)) {
      if (!round.participants.includes(name)) delete map[name];
    }
  }
}

function toggleParticipant(round, member) {
  const picked = new Set(round.participants);
  if (!picked.delete(member)) picked.add(member);
  setParticipants(round, picked);
}

function moveRound(i, delta) {
  const j = i + delta;
  if (j < 0 || j >= state.rounds.length) return;
  [state.rounds[i], state.rounds[j]] = [state.rounds[j], state.rounds[i]];
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (addMember(nameInput.value)) nameInput.value = '';
  render();
  nameInput.focus();
});

nameInput.addEventListener('input', () => {
  if (memberNotice) {
    memberNotice = '';
    render();
  }
});

membersEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-index]');
  if (!btn) return;
  const name = state.members[Number(btn.dataset.index)];
  const hit = state.rounds.map((r, i) => [r, i]).filter(([r]) => r.participants.includes(name));
  if (hit.length) {
    const list = hit.map(([r, i]) => '- ' + roundLabel(r, i)).join('\n');
    if (!confirm(`'${name}'을(를) 삭제하면 아래 차수의 참석자에서도 빠져요.\n${list}\n삭제할까요?`)) return;
  }
  state.members.splice(Number(btn.dataset.index), 1);
  for (const [r] of hit) setParticipants(r, new Set(r.participants.filter((m) => m !== name)));
  render();
});

addRoundBtn.addEventListener('click', () => {
  // 이름이 키라서 __proto__ 같은 이름도 일반 키로 쓰이도록 프로토타입 없는 객체로 둔다.
  state.rounds.push({ id: nextRoundId++, name: '', total: null, participants: [], fixed: Object.create(null), sent: Object.create(null) });
  render();
});

settleBtn.addEventListener('click', () => {
  settleShown = true;
  render({ inputs: false });
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function amountOf(input) {
  // Number가 정확히 다루는 범위 안에 두려고 12자리로 자른다.
  const digits = input.value.replace(/\D/g, '').slice(0, 12);
  if (digits !== input.value) input.value = digits;
  return digits ? Number(digits) : null;
}

function roundOf(el) {
  const id = Number(el.closest('[data-round-id]').dataset.roundId);
  return state.rounds.findIndex((r) => r.id === id);
}

roundsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const i = roundOf(btn);
  const round = state.rounds[i];
  switch (btn.dataset.action) {
    case 'up': moveRound(i, -1); break;
    case 'down': moveRound(i, 1); break;
    case 'remove': state.rounds.splice(i, 1); break;
    case 'all': setParticipants(round, new Set(state.members)); break;
    case 'none': setParticipants(round, new Set()); break;
    case 'toggle': toggleParticipant(round, btn.dataset.member); break;
  }
  render();
});

roundsEl.addEventListener('input', (e) => {
  const input = e.target;
  const roundIndex = roundOf(input);
  const round = state.rounds[roundIndex];
  if (input.classList.contains('name')) {
    round.name = input.value;
    render({ inputs: false });
    return;
  }
  const member = input.dataset.member;
  if (input.type === 'checkbox') {
    const { field } = input.dataset;
    if (!input.checked) delete round[field][member];
    else if (field === 'sent') round.sent[member] = true;
    else round.fixed[member] = roundShares(state, roundIndex).byName?.get(member)?.amount ?? 0;
    render({ inputs: false });
    if (input.checked && field === 'fixed') {
      const amountInput = input.closest('.attendee').querySelector('input[type="text"]');
      amountInput.focus();
      amountInput.select();
    }
    return;
  }
  const amount = amountOf(input);
  if (member === undefined) round.total = amount;
  else round.fixed[member] = amount ?? 0;
  render({ inputs: false });
});

titleInput.addEventListener('input', () => {
  state.title = titleInput.value;
  render({ inputs: false });
});

resetBtn.addEventListener('click', () => {
  if (!confirm('입력한 내용을 모두 지우고 새로 시작할까요?')) return;
  Object.assign(state, { members: [], rounds: [], title: '' });
  memberNotice = '';
  nextRoundId = 1;
  settleShown = false;
  nameInput.value = '';
  titleInput.value = '';
  render();
});

// 창 크기뿐 아니라 컨테이너 폭이 바뀔 때(결과 카드가 처음 나타날 때 포함)도 다시 맞춘다. 높이 변화로는 다시 돌지 않게 폭만 본다.
let fitWidth = 0;
new ResizeObserver(([entry]) => {
  if (entry.contentRect.width === fitWidth) return;
  fitWidth = entry.contentRect.width;
  fitTable();
}).observe(resultBodyEl);

Object.assign(state, load());
nextRoundId = Math.max(0, ...state.rounds.map((r) => r.id)) + 1;
titleInput.value = state.title;
render();
</script>
</body>
</html>
