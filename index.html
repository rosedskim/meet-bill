<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모임 정산</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1c1e21;
  --muted: #5f6670;
  --border: #d5d9df;
  --accent: #2f6fed;
  --accent-text: #ffffff;
  --danger: #c62828;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a;
    --surface: #1f2329;
    --text: #e8eaed;
    --muted: #9aa1ab;
    --border: #363c45;
    --accent: #6c9bff;
    --accent-text: #101318;
    --danger: #ff8a80;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
main { max-width: 640px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.4rem; margin: 0 0 16px; }
h2 { font-size: 1rem; margin: 0 0 12px; }
section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
}
form { display: flex; gap: 8px; }
input {
  flex: 1;
  min-width: 0;
  font: inherit;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
}
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 8px;
}
form button {
  background: var(--accent);
  color: var(--accent-text);
  padding: 8px 16px;
}
.notice { min-height: 1.5em; margin: 8px 0 0; color: var(--danger); font-size: 0.875rem; }
.tags, .picks { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
.tags li {
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 100%;
  padding: 4px 4px 4px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  overflow-wrap: anywhere;
}
.tags button {
  flex: none;
  width: 28px;
  height: 28px;
  background: transparent;
  color: var(--muted);
  line-height: 1;
}
.empty { color: var(--muted); font-size: 0.875rem; }
section + section { margin-top: 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; }
.section-head h2 { margin: 0; }
.solid { background: var(--accent); color: var(--accent-text); padding: 8px 16px; }
.outline {
  min-width: 36px;
  min-height: 36px;
  padding: 4px 12px;
  background: transparent;
  color: inherit;
  border: 1px solid var(--border);
}
.outline[aria-disabled="true"] { opacity: 0.4; cursor: default; }
.rounds { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.card-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.card-head h3 { flex: 1; margin: 0; font-size: 1rem; }
.fields { display: flex; flex-wrap: wrap; gap: 8px; }
.fields input { flex: 2 1 140px; background: var(--surface); }
.fields .total { flex: 1 1 120px; }
.pick-head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.pick-head .outline { padding: 4px 8px; }
.pick-head span { flex: 1; white-space: nowrap; color: var(--muted); font-size: 0.875rem; }
.pick {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: inherit;
  text-align: left;
  overflow-wrap: anywhere;
}
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.pick[aria-pressed="true"]::before { content: "\2713\00a0"; }
.fixed-row, .paid-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 8px 0 0; }
.fixed-row span, .paid-row span { flex: 1 1 4em; min-width: 0; overflow-wrap: anywhere; }
.fixed-row input { flex: 2 1 140px; background: var(--surface); }
.paid-row input { flex: 2 1 140px; }
#paid h3 { margin: 16px 0 0; font-size: 1rem; }
.summary { width: 100%; margin-top: 12px; }
.result { border: 2px solid var(--accent); padding: 8px; }
.result h2 { padding: 0 4px; }
@media (max-width: 480px) { .result { margin-inline: -8px; padding: 4px; } }
.errors { margin: 0; padding-left: 20px; color: var(--danger); }
.table-wrap { overflow-x: auto; }
table {
  width: max-content;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}
th, td { padding: 0.3em 0.2em; border: 1px solid var(--border); text-align: right; white-space: nowrap; }
thead th { text-align: center; vertical-align: bottom; background: var(--bg); }
th[scope="row"] { text-align: left; padding-left: 0.4em; }
tfoot th { font-weight: 600; }
tfoot th, tfoot td, td.total { background: var(--bg); }
th span { display: block; }
.round-name { max-width: 5.5em; margin-inline: auto; font-weight: 400; color: var(--muted); white-space: normal; overflow-wrap: anywhere; }
.paid-head { max-width: 4.5em; margin-inline: auto; white-space: normal; }
.extra { display: block; font-size: 0.75em; color: var(--accent); line-height: 1.1; }
</style>
</head>
<body>
<main>
  <h1>모임 정산</h1>
  <section>
    <h2>인원</h2>
    <form id="member-form" autocomplete="off">
      <input id="member-name" type="text" placeholder="이름" aria-label="이름">
      <button type="submit">등록</button>
    </form>
    <p id="member-notice" class="notice" role="status"></p>
    <ul id="members" class="tags"></ul>
    <div id="paid" hidden>
      <h3>이미 보낸 금액</h3>
      <div id="paid-rows"></div>
    </div>
  </section>
  <section>
    <div class="section-head">
      <h2>차수</h2>
      <button id="add-round" type="button" class="solid">차수 추가</button>
    </div>
    <div id="rounds" class="rounds"></div>
    <button id="summarize" type="button" class="solid summary">요약</button>
  </section>
  <section id="result" class="result" hidden>
    <h2>결과</h2>
    <div id="result-body"></div>
  </section>
</main>
<script>
// 이름이 키라서 fixed와 같이 __proto__ 같은 이름도 일반 키로 쓰이도록 프로토타입 없는 객체로 둔다.
const state = { members: [], rounds: [], paid: Object.create(null) };
let memberNotice = '';
let nextRoundId = 1;
let summaryShown = false;

const form = document.getElementById('member-form');
const nameInput = document.getElementById('member-name');
const noticeEl = document.getElementById('member-notice');
const membersEl = document.getElementById('members');
const paidEl = document.getElementById('paid');
const paidRowsEl = document.getElementById('paid-rows');
const roundsEl = document.getElementById('rounds');
const addRoundBtn = document.getElementById('add-round');
const summarizeBtn = document.getElementById('summarize');
const resultEl = document.getElementById('result');
const resultBodyEl = document.getElementById('result-body');

// 인원 입력칸은 HTML에 고정해 두고 render가 건드리지 않는다. 다시 그리면 타이핑 중 포커스가 사라진다.
function renderMembers() {
  noticeEl.textContent = memberNotice;

  const tags = state.members.map((name, i) => {
    const li = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = name;
    const del = document.createElement('button');
    del.type = 'button';
    del.textContent = '×';
    del.setAttribute('aria-label', name + ' 삭제');
    del.dataset.index = i;
    li.append(label, del);
    return li;
  });
  membersEl.replaceChildren(...tags);
}

function paidRow(name) {
  const row = document.createElement('div');
  row.className = 'paid-row';
  const who = document.createElement('span');
  who.textContent = name;
  const amount = document.createElement('input');
  amount.type = 'text';
  amount.inputMode = 'numeric';
  amount.placeholder = '이미 보낸 금액(선택)';
  amount.setAttribute('aria-label', name + ' 이미 보낸 금액');
  amount.autocomplete = 'off';
  amount.dataset.key = 'paid:' + name;
  amount.dataset.member = name;
  amount.value = state.paid[name] ?? '';
  row.append(who, amount);
  return row;
}

function button(cls, text, label, key, action) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = cls;
  b.textContent = text;
  b.setAttribute('aria-label', label);
  b.dataset.key = key;
  b.dataset.action = action;
  return b;
}

const ordinal = (i) => i + 1 + '차';

function roundCard(round, i) {
  const n = ordinal(i);
  const k = (what) => round.id + ':' + what;

  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.roundId = round.id;

  const head = document.createElement('div');
  head.className = 'card-head';
  const title = document.createElement('h3');
  title.textContent = n;
  const up = button('outline', '▲', n + ' 위로 이동', k('up'), 'up');
  const down = button('outline', '▼', n + ' 아래로 이동', k('down'), 'down');
  up.setAttribute('aria-disabled', i === 0);
  down.setAttribute('aria-disabled', i === state.rounds.length - 1);
  head.append(title, up, down, button('outline', '삭제', n + ' 삭제', k('remove'), 'remove'));

  const fields = document.createElement('div');
  fields.className = 'fields';
  const name = document.createElement('input');
  name.type = 'text';
  name.className = 'name';
  name.placeholder = '이름 (예: 미미철판)';
  name.setAttribute('aria-label', n + ' 이름');
  name.autocomplete = 'off';
  name.dataset.key = k('name');
  name.value = round.name;
  const total = document.createElement('input');
  total.type = 'text';
  total.className = 'total';
  total.inputMode = 'numeric';
  total.placeholder = '총금액(원)';
  total.setAttribute('aria-label', n + ' 총금액');
  total.autocomplete = 'off';
  total.dataset.key = k('total');
  total.value = round.total ?? '';
  fields.append(name, total);

  const pickHead = document.createElement('div');
  pickHead.className = 'pick-head';
  const label = document.createElement('span');
  label.textContent = '참석자 ' + round.participants.length + '/' + state.members.length;
  pickHead.append(
    label,
    button('outline', '전체선택', n + ' 전체선택', k('all'), 'all'),
    button('outline', '전체해제', n + ' 전체해제', k('none'), 'none'),
  );

  const picks = document.createElement('div');
  picks.className = 'picks';
  if (!state.members.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = '인원을 먼저 등록하세요';
    picks.append(empty);
  }
  for (const m of state.members) {
    const pick = button('pick', m, m, k('tag:' + m), 'toggle');
    pick.dataset.member = m;
    pick.setAttribute('aria-pressed', round.participants.includes(m));
    picks.append(pick);
  }

  const fixedRows = round.participants.map((m) => {
    const row = document.createElement('div');
    row.className = 'fixed-row';
    const who = document.createElement('span');
    who.textContent = m;
    const amount = document.createElement('input');
    amount.type = 'text';
    amount.inputMode = 'numeric';
    amount.placeholder = '고정 금액(선택)';
    amount.setAttribute('aria-label', n + ' ' + m + ' 고정 금액');
    amount.autocomplete = 'off';
    amount.dataset.key = k('fixed:' + m);
    amount.dataset.member = m;
    amount.value = round.fixed[m] ?? '';
    row.append(who, amount);
    return row;
  });

  card.append(head, fields, pickHead, picks, ...fixedRows);
  return card;
}

// 입력칸은 input 이벤트가 상태만 고치고 다시 그리지 않는다. 구조가 바뀔 때만 영역을 새로 만들고, 포커스와 선택 범위를 data-key로 되찾는다.
function redraw(container, children, fallback) {
  const active = document.activeElement;
  const hadFocus = container.contains(active);
  const key = hadFocus ? active.dataset.key : null;
  const range = hadFocus && active.selectionStart !== undefined ? [active.selectionStart, active.selectionEnd] : null;

  container.replaceChildren(...children);

  if (!hadFocus) return;
  const next = [...container.querySelectorAll('[data-key]')].find((el) => el.dataset.key === key) ?? fallback;
  next.focus();
  if (range && next.setSelectionRange) next.setSelectionRange(...range);
}

function renderRounds() {
  redraw(roundsEl, state.rounds.map(roundCard), addRoundBtn);
}

function renderPaid() {
  paidEl.hidden = !state.members.length;
  redraw(paidRowsEl, state.members.map(paidRow), nameInput);
}

const won = (n) => n.toLocaleString('ko-KR');
const remainingText = (n) => (n === 0 ? '완료' : n < 0 ? '환급 ' + won(-n) + '원' : won(n));

function resultHead(round, i) {
  const th = document.createElement('th');
  th.scope = 'col';
  const n = document.createElement('span');
  n.textContent = ordinal(i);
  th.append(n);
  const name = round.name.trim();
  if (name) {
    const nm = document.createElement('span');
    nm.className = 'round-name';
    nm.textContent = name;
    th.append(nm);
  }
  return th;
}

function resultCell(cell) {
  const td = document.createElement('td');
  if (!cell) {
    td.textContent = '-';
    return td;
  }
  td.textContent = won(cell.amount);
  if (cell.extra) {
    const mark = document.createElement('span');
    mark.className = 'extra';
    mark.textContent = '+1';
    td.append(mark);
  }
  return td;
}

// 표는 nowrap이라 숫자가 쪼개지지 않는 대신 자연 폭이 컨테이너보다 클 수 있다. 글자 크기를 줄여 맞추고, 하한에 걸리면 표 컨테이너만 가로 스크롤한다.
// 테두리는 글자 크기와 무관한 1px이고 글자 폭도 소수점 단위로 반올림되어 한 번에 맞지 않으므로, 맞을 때까지 몇 번 더 보정한다.
const TABLE_FONT_MAX = 14;
const TABLE_FONT_MIN = 8;

function fitTable() {
  const wrap = resultBodyEl.querySelector('.table-wrap');
  if (!wrap || !wrap.clientWidth) return;
  const table = wrap.firstChild;
  let size = TABLE_FONT_MAX;
  for (let i = 0; i < 4; i++) {
    wrap.style.fontSize = size + 'px';
    const width = table.getBoundingClientRect().width;
    if (width <= wrap.clientWidth || size === TABLE_FONT_MIN) return;
    size = Math.max(TABLE_FONT_MIN, (size * (wrap.clientWidth - 0.5)) / width);
  }
}

function resultTable(result) {
  const table = document.createElement('table');

  const headRow = document.createElement('tr');
  const corner = document.createElement('th');
  corner.textContent = '이름';
  const sum = document.createElement('th');
  sum.scope = 'col';
  sum.textContent = '합계';
  headRow.append(corner, ...state.rounds.map(resultHead), sum);
  if (result.showPaid) {
    const paid = document.createElement('th');
    paid.scope = 'col';
    const paidText = document.createElement('span');
    paidText.className = 'paid-head';
    paidText.textContent = '이미 보낸 금액';
    paid.append(paidText);
    const remaining = document.createElement('th');
    remaining.scope = 'col';
    remaining.textContent = '남은 금액';
    headRow.append(paid, remaining);
  }
  const thead = document.createElement('thead');
  thead.append(headRow);

  const tbody = document.createElement('tbody');
  for (const row of result.rows) {
    const tr = document.createElement('tr');
    const who = document.createElement('th');
    who.scope = 'row';
    who.textContent = row.name;
    const total = document.createElement('td');
    total.className = 'total';
    total.textContent = won(row.total);
    tr.append(who, ...row.cells.map(resultCell), total);
    if (result.showPaid) {
      const paid = document.createElement('td');
      paid.textContent = row.paid ? won(row.paid) : '-';
      const remaining = document.createElement('td');
      remaining.textContent = remainingText(row.remaining);
      tr.append(paid, remaining);
    }
    tbody.append(tr);
  }

  const footRow = document.createElement('tr');
  const label = document.createElement('th');
  label.scope = 'row';
  label.textContent = '합계';
  const cells = [...result.roundTotals, result.grandTotal].map((n) => {
    const td = document.createElement('td');
    td.textContent = won(n);
    return td;
  });
  footRow.append(label, ...cells);
  // 남은 금액의 합은 환급과 미납이 섞이고, 이미 보낸 금액의 합은 전체 합계 옆에서 정산 합계로 읽혀 둘 다 비운다.
  if (result.showPaid) footRow.append(document.createElement('td'), document.createElement('td'));
  const tfoot = document.createElement('tfoot');
  tfoot.append(footRow);

  table.append(thead, tbody, tfoot);
  return table;
}

function resultErrors(errors) {
  const intro = document.createElement('p');
  intro.textContent = '아래를 고치면 표가 나와요.';
  const list = document.createElement('ul');
  list.className = 'errors';
  list.append(...errors.map(({ message }) => {
    const li = document.createElement('li');
    li.textContent = message;
    return li;
  }));
  return [intro, list];
}

function renderResult() {
  resultEl.hidden = !summaryShown;
  if (!summaryShown) return;

  if (!state.members.length || !state.rounds.length) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = state.members.length ? '차수를 추가하세요' : '인원을 먼저 등록하세요';
    resultBodyEl.replaceChildren(empty);
    return;
  }
  const result = calc(state);
  if (result.errors.length) {
    resultBodyEl.replaceChildren(...resultErrors(result.errors));
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  wrap.append(resultTable(result));
  resultBodyEl.replaceChildren(wrap);
  fitTable();
}

// 모든 상태 변경은 render를 거친다. 이름·총금액·고정 금액·이미 보낸 금액 input은 입력칸을 다시 그리면 포커스를 잃으므로 inputs: false로 결과만 갱신한다.
function render({ inputs = true } = {}) {
  renderMembers();
  if (inputs) {
    renderRounds();
    renderPaid();
  }
  renderResult();
}

function addMember(raw) {
  const name = raw.trim();
  if (!name) return false;
  if (state.members.includes(name)) {
    memberNotice = '이미 등록된 이름이에요';
    return false;
  }
  state.members.push(name);
  memberNotice = '';
  return true;
}

function roundLabel(round, i) {
  const name = round.name.trim();
  return name ? ordinal(i) + ' ' + name : ordinal(i);
}

// 남는 1원은 받을 사람 중 뒤에서부터 1원씩 더 낸다. 고정 금액자를 뺀 나머지에도 같은 규칙을 쓰려고 사람 목록과 금액만 받는다.
function distribute(people, amount) {
  const base = Math.floor(amount / people.length);
  const firstExtra = people.length - (amount - base * people.length);
  return people.map((_, i) => ({ amount: base + (i >= firstExtra ? 1 : 0), extra: i >= firstExtra }));
}

function calc(state) {
  const errors = [];
  const shares = state.rounds.map((round, roundIndex) => {
    const label = roundLabel(round, roundIndex);
    const attendees = state.members.filter((m) => round.participants.includes(m));
    const valid = round.total !== null && round.total > 0;
    if (round.total === null) errors.push({ roundIndex, message: label + ': 총금액을 입력하세요' });
    else if (!valid) errors.push({ roundIndex, message: label + ': 총금액은 0보다 커야 해요' });
    if (!attendees.length) errors.push({ roundIndex, message: label + ': 참석자를 선택하세요' });
    if (!valid || !attendees.length) return null;
    const pinned = attendees.filter((m) => m in round.fixed);
    const free = attendees.filter((m) => !(m in round.fixed));
    const pinnedSum = pinned.reduce((sum, m) => sum + round.fixed[m], 0);
    const rest = round.total - pinnedSum;
    if (rest < 0) {
      errors.push({ roundIndex, message: label + ': 고정 금액의 합(' + won(pinnedSum) + '원)이 총금액보다 커요' });
      return null;
    }
    if (!free.length && rest > 0) {
      errors.push({ roundIndex, message: label + ': 모두 고정인데 합(' + won(pinnedSum) + '원)이 총금액과 달라요' });
      return null;
    }
    const split = distribute(free, rest);
    return new Map([
      ...pinned.map((m) => [m, { amount: round.fixed[m], extra: false }]),
      ...free.map((m, i) => [m, split[i]]),
    ]);
  });
  if (errors.length) return { errors, rows: null, roundTotals: null, grandTotal: null, showPaid: false };

  const rows = state.members.map((name) => {
    const cells = shares.map((s) => s.get(name) ?? null);
    const total = cells.reduce((sum, c) => sum + (c ? c.amount : 0), 0);
    const paid = state.paid[name] ?? 0;
    return { name, cells, total, paid, remaining: total - paid };
  });
  const roundTotals = shares.map((_, r) => rows.reduce((sum, row) => sum + (row.cells[r] ? row.cells[r].amount : 0), 0));
  const showPaid = rows.some((row) => row.paid > 0);
  return { errors, rows, roundTotals, grandTotal: roundTotals.reduce((a, b) => a + b, 0), showPaid };
}

// participants는 항상 members 순서로 다시 만든다. 순서를 보존하고 중복이 생길 수 없다.
// 참석자에서 빠진 사람의 고정 금액도 여기서 지워, 다시 참석해도 예전 금액이 되살아나지 않는다.
function setParticipants(round, picked) {
  round.participants = state.members.filter((m) => picked.has(m));
  for (const name of Object.keys(round.fixed)) {
    if (!round.participants.includes(name)) delete round.fixed[name];
  }
}

function toggleParticipant(round, member) {
  const picked = new Set(round.participants);
  if (!picked.delete(member)) picked.add(member);
  setParticipants(round, picked);
}

function moveRound(i, delta) {
  const j = i + delta;
  if (j < 0 || j >= state.rounds.length) return;
  [state.rounds[i], state.rounds[j]] = [state.rounds[j], state.rounds[i]];
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (addMember(nameInput.value)) nameInput.value = '';
  render();
  nameInput.focus();
});

nameInput.addEventListener('input', () => {
  if (memberNotice) {
    memberNotice = '';
    render();
  }
});

membersEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-index]');
  if (!btn) return;
  const name = state.members[Number(btn.dataset.index)];
  const hit = state.rounds.map((r, i) => [r, i]).filter(([r]) => r.participants.includes(name));
  if (hit.length) {
    const list = hit.map(([r, i]) => '- ' + roundLabel(r, i)).join('\n');
    if (!confirm(`'${name}'을(를) 삭제하면 아래 차수의 참석자에서도 빠져요.\n${list}\n삭제할까요?`)) return;
  }
  state.members.splice(Number(btn.dataset.index), 1);
  delete state.paid[name];
  for (const [r] of hit) setParticipants(r, new Set(r.participants.filter((m) => m !== name)));
  render();
});

addRoundBtn.addEventListener('click', () => {
  // 이름이 키라서 __proto__ 같은 이름도 일반 키로 쓰이도록 프로토타입 없는 객체로 둔다.
  state.rounds.push({ id: nextRoundId++, name: '', total: null, participants: [], fixed: Object.create(null) });
  render();
});

summarizeBtn.addEventListener('click', () => {
  summaryShown = true;
  render({ inputs: false });
  resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

function amountOf(input) {
  // Number가 정확히 다루는 범위 안에 두려고 12자리로 자른다.
  const digits = input.value.replace(/\D/g, '').slice(0, 12);
  if (digits !== input.value) input.value = digits;
  return digits ? Number(digits) : null;
}

paidRowsEl.addEventListener('input', (e) => {
  const amount = amountOf(e.target);
  if (amount === null) delete state.paid[e.target.dataset.member];
  else state.paid[e.target.dataset.member] = amount;
  render({ inputs: false });
});

function roundOf(el) {
  const id = Number(el.closest('[data-round-id]').dataset.roundId);
  return state.rounds.findIndex((r) => r.id === id);
}

roundsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const i = roundOf(btn);
  const round = state.rounds[i];
  switch (btn.dataset.action) {
    case 'up': moveRound(i, -1); break;
    case 'down': moveRound(i, 1); break;
    case 'remove': state.rounds.splice(i, 1); break;
    case 'all': setParticipants(round, new Set(state.members)); break;
    case 'none': setParticipants(round, new Set()); break;
    case 'toggle': toggleParticipant(round, btn.dataset.member); break;
  }
  render();
});

roundsEl.addEventListener('input', (e) => {
  const input = e.target;
  const round = state.rounds[roundOf(input)];
  if (input.classList.contains('name')) {
    round.name = input.value;
    render({ inputs: false });
    return;
  }
  const amount = amountOf(input);
  const member = input.dataset.member;
  if (member === undefined) round.total = amount;
  else if (amount === null) delete round.fixed[member];
  else round.fixed[member] = amount;
  render({ inputs: false });
});

window.addEventListener('resize', fitTable);

render();
</script>
</body>
</html>
